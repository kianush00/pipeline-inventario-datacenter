# pyproject.toml
# ==============

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "inventory-pipeline"
version = "0.1.0"
description = "Automated, idempotent ETL pipeline that collects, consolidates and synchronizes datacenter infrastructure into NetBox."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
# Runtime dependencies; requirements.txt pins the exact versions (lock).
dependencies = [
    "openpyxl>=3.1",
    "pydantic>=2.0",
    "pynetbox>=7.0",
    "PyYAML>=6.0",
    "requests>=2.31",
    "urllib3>=2.0",
]

[project.scripts]
inventory-pipeline = "inventory_pipeline.run_pipeline:main"

# ── Packaging (src layout) ──────────────────────────────────
[tool.setuptools.packages.find]
where = ["src"]

# ── Ruff (linter and formatter) ─────────────────────────────
[tool.ruff]
src = ["src", "tests"]

# ── Pyright (static typing) ─────────────────────────────────
[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"

# ── Pytest ──────────────────────────────────────────────────
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
