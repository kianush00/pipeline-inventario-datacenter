# netbox_mapping.yaml
# ====================
# Contrato de exportación entre merged_inventory.csv y NetBox 4.6+.
# Leído exclusivamente por export_to_netbox.py.
# No depende de rundeck_header_list.txt.
#
# ── Credenciales ─────────────────────────────────────────────
# Se leen desde variables de entorno (nunca en este archivo):
#   NETBOX_URL        → URL de NetBox
#   NETBOX_TOKEN      → token con permisos write sobre
#                       dcim, virtualization, ipam, extras, core
#   NETBOX_VERIFY_SSL → "true" / "false" (por defecto: true)

# ── Site único ───────────────────────────────────────────────
# Todos los objetos se asignan a este site.
# Si no existe en NetBox, el script lo crea automáticamente.
site:
  name: "Datacenter Principal"
  slug: "datacenter-principal"

# ── ClusterType ──────────────────────────────────────────────
# Las VMs se agrupan en un Cluster cuyo nombre coincide con el
# valor del campo 'Host/Cluster/Chassis' en el CSV.
# El cluster_type se crea automáticamente si no existe.
cluster_type:
  name: "Hipervisor"
  slug: "hipervisor"

# ── Roles de dispositivo ─────────────────────────────────────
# Lista canónica de Device Roles utilizados por Devices y VMs.
# El valor de 'Rol' del CSV debe coincidir con uno de estos nombres.
# Los roles se crean automáticamente si no existen.
# Los colores son valores hexadecimales sin '#'.
device_roles:
  - name: "Hypervisor"
    slug: "hypervisor"
    color: "9c27b0"
  - name: "DNS Server"
    slug: "dns-server"
    color: "2196f3"
  - name: "DHCP Server"
    slug: "dhcp-server"
    color: "2196f3"
  - name: "Mail Server"
    slug: "mail-server"
    color: "009688"
  - name: "Database Server"
    slug: "database-server"
    color: "f44336"
  - name: "Web Server"
    slug: "web-server"
    color: "4caf50"
  - name: "Application Server"
    slug: "application-server"
    color: "8bc34a"
  - name: "Storage Server"
    slug: "storage-server"
    color: "ff9800"
  - name: "Backup Server"
    slug: "backup-server"
    color: "795548"
  - name: "Monitoring Server"
    slug: "monitoring-server"
    color: "00bcd4"
  - name: "Management Server"
    slug: "management-server"
    color: "607d8b"
  - name: "Authentication Server"
    slug: "authentication-server"
    color: "673ab7"
  - name: "Proxy Server"
    slug: "proxy-server"
    color: "ff5722"
  - name: "Repository Server"
    slug: "repository-server"
    color: "cddc39"
  - name: "Logging Server"
    slug: "logging-server"
    color: "9e9e9e"
  - name: "VPN Server"
    slug: "vpn-server"
    color: "3f51b5"
  - name: "File Server"
    slug: "file-server"
    color: "ffeb3b"
  - name: "Tape Drive"
    slug: "tape-drive"
    color: "795548"
  - name: "Chassis"
    slug: "chassis"
    color: "607d8b"
  - name: "Container Host"
    slug: "container-host"
    color: "00bcd4"
  - name: "Network/Firewall Device"
    slug: "network-firewall-device"
    color: "f44336"
  - name: "Others"
    slug: "others"
    color: "9e9e9e"

# ── Tipo de máquina ──────────────────────────────────────────
# Clasificación interna del inventario.
# Se conserva exactamente como aparece en el CSV.
# Se almacena en NetBox como Custom Field de tipo Selection.
machine_type:
  field_name: "machine_type"
  label: "Tipo de maquina"
  type: "selection"
  required: true
  object_types:
    - "dcim.device"
    - "virtualization.virtualmachine"
  choice_set:
    name: "Machine Type"
    choices:
      - value: "Dedicada"
        label: "Dedicada"
      - value: "Hipervisor"
        label: "Hipervisor"
      - value: "VM"
        label: "VM"

# ── Entorno ──────────────────────────────────────────────────
# Representa el entorno lógico en el que opera el nodo.
# No se utiliza el status de NetBox para representar Producción,
# Certificación o Desarrollo.
# Se almacena como Custom Field de tipo Selection.
environment:
  field_name: "environment"
  label: "Entorno"
  type: "selection"
  required: false
  object_types:
    - "dcim.device"
    - "virtualization.virtualmachine"
  choice_set:
    name: "Environment"
    choices:
      - value: "production"
        label: "Producción"
      - value: "certification"
        label: "Certificación"
      - value: "development"
        label: "Desarrollo"

environment_map:
  "Producción": "production"
  "Certificación": "certification"
  "Desarrollo": "development"


# ── Tipo de máquina → modelo NetBox ──────────────────────────
# Determina si la fila se exporta como Device o VirtualMachine.
machine_type_map:
  "Dedicada": "device"
  "Hipervisor": "device"
  "VM": "virtual_machine"

# ── Estado → NetBox status ───────────────────────────────────
# 'Estado' del inventario maestro utiliza directamente la
# semántica del campo status de NetBox.
#
# Valores admitidos:
#   active
#   planned
#   staged
#   failed
#   inventory
#   decommissioning
#   offline
#
# El valor almacenado en el CSV está en español y se transforma
# al valor interno utilizado por NetBox.
#
# Si el valor recibido no está definido en este mapa, el script
# deberá aplicar el fallback correspondiente al tipo de objeto:
#   Device           → inventory
#   VirtualMachine   → staged
status_map:
  "Activo": "active"
  "Planificado": "planned"
  "En preparación": "staged"
  "Fallido": "failed"
  "En inventario": "inventory"
  "En baja": "decommissioning"
  "Fuera de línea": "offline"

status_defaults:
  device: "inventory"
  virtual_machine: "staged"

# ── Custom Fields ────────────────────────────────────────────
# El script garantiza que estos custom fields existen en NetBox.
#
# Los campos de tipo "selection" utilizan choice_set para definir
# sus valores válidos.
#
# NOTA NetBox 4.6+:
#   - El campo se llama "object_types".
#   - Los tipos se referencian mediante app_label.model.
#   - Los Custom Fields de selección utilizan Choice Sets.

custom_fields:
  - name: "inventory_uuid"
    label: "UUID de inventario"
    type: "text"
    required: false
    object_types:
      - "dcim.device"
      - "virtualization.virtualmachine"

  - name: "service_tag"
    label: "Service Tag"
    type: "text"
    required: false
    object_types:
      - "dcim.device"

  - name: "cpu_model"
    label: "Modelo CPU"
    type: "text"
    required: false
    object_types:
      - "dcim.device"
      - "virtualization.virtualmachine"

  - name: "cpu_cores"
    label: "Cores CPU"
    type: "integer"
    required: false
    object_types:
      - "dcim.device"
      - "virtualization.virtualmachine"

  - name: "cpu_threads"
    label: "Threads CPU"
    type: "integer"
    required: false
    object_types:
      - "dcim.device"

  - name: "cpu_sockets"
    label: "Sockets CPU"
    type: "integer"
    required: false
    object_types:
      - "dcim.device"

  - name: "disks"
    label: "Discos"
    type: "text"
    required: false
    object_types:
      - "dcim.device"
      - "virtualization.virtualmachine"

  - name: "raid"
    label: "RAID"
    type: "text"
    required: false
    object_types:
      - "dcim.device"

  - name: "bios_version"
    label: "Versión BIOS"
    type: "text"
    required: false
    object_types:
      - "dcim.device"

  - name: "bios_date"
    label: "Fecha BIOS"
    type: "text"
    required: false
    object_types:
      - "dcim.device"

  - name: "rundeck_node"
    label: "Nodo Rundeck"
    type: "boolean"
    required: false
    default: false
    object_types:
      - "dcim.device"
      - "virtualization.virtualmachine"

# ── Campos nativos de Device (DCIM) ──────────────────────────
# 'source' → nombre exacto de la columna en merged_inventory.csv.
# 'target' → campo en el API de NetBox.
# 'skip_if_empty' → no enviar el campo si el valor es vacío/N/A.

device_fields:
  - source: "Nombre maquina"
    target: "name"
    skip_if_empty: false

  - source: "Serial Number"
    target: "serial"
    skip_if_empty: true

  - source: "Nro Inventario"
    target: "asset_tag"
    skip_if_empty: true

  - source: "Rack"
    target: "rack"
    skip_if_empty: true

  - source: "Posicion (U)"
    target: "position"
    skip_if_empty: true
    cast: "int"

  - source: "Altura (U)"
    target: "_u_height"
    skip_if_empty: true
    cast: "int"

  - source: "SO Host"
    target: "platform"
    skip_if_empty: true

  - source: ["Descripcion", "Notas"]
    target: "description"
    transform: "concat_dot"
    skip_if_empty: true

# ── Campos específicos de Device ─────────────────────────────
device_custom_fields:
  - source: "UUID"
    target: "inventory_uuid"
    skip_if_empty: true

  - source: "Tipo de maquina"
    target: "machine_type"
    skip_if_empty: false

  - source: "Entorno"
    target: "environment"
    skip_if_empty: true
    map: "environment_map"

  - source: "Service Tag"
    target: "service_tag"
    skip_if_empty: true

  - source: "CPU Modelo"
    target: "cpu_model"
    skip_if_empty: true

  - source: "Cores"
    target: "cpu_cores"
    skip_if_empty: true
    cast: "int"

  - source: "Threads"
    target: "cpu_threads"
    skip_if_empty: true
    cast: "int"

  - source: "Sockets"
    target: "cpu_sockets"
    skip_if_empty: true
    cast: "int"

  - source: "Discos"
    target: "disks"
    skip_if_empty: true

  - source: "RAID"
    target: "raid"
    skip_if_empty: true

  - source: "Version BIOS"
    target: "bios_version"
    skip_if_empty: true

  - source: "Fecha BIOS"
    target: "bios_date"
    skip_if_empty: true

  - source: "Nodo Rundeck"
    target: "rundeck_node"
    skip_if_empty: true
    cast: "bool_si_no"

# ── Campos nativos de VirtualMachine ─────────────────────────
vm_fields:
  - source: "Nombre maquina"
    target: "name"
    skip_if_empty: false

  - source: "SO Host"
    target: "platform"
    skip_if_empty: true

  - source: "RAM (GB)"
    target: "memory"
    skip_if_empty: true
    cast: "int_gb_to_mb"

  - source: "Capacidad visible (GB)"
    target: "disk"
    skip_if_empty: true
    cast: "int"

  - source: ["Descripcion", "Notas"]
    target: "description"
    transform: "concat_dot"
    skip_if_empty: true

# ── Campos específicos de VirtualMachine ─────────────────────
vm_custom_fields:
  - source: "UUID"
    target: "inventory_uuid"
    skip_if_empty: true

  - source: "Tipo de maquina"
    target: "machine_type"
    skip_if_empty: false

  - source: "Entorno"
    target: "environment"
    skip_if_empty: true
    map: "environment_map"

  - source: "CPU Modelo"
    target: "cpu_model"
    skip_if_empty: true

  - source: "Cores"
    target: "cpu_cores"
    skip_if_empty: true
    cast: "int"

  - source: "Discos"
    target: "disks"
    skip_if_empty: true

  - source: "Nodo Rundeck"
    target: "rundeck_node"
    skip_if_empty: true
    cast: "bool_si_no"


# ── Interfaces de red ─────────────────────────────────────────
# Las cinco columnas de red se parsean en paralelo por posición.
#
# Si los arrays resultantes no tienen la misma longitud, la
# sincronización de interfaces de esa fila se omite.
# El Device/VM se sincroniza de todas formas.

network:
  columns:
    names: "Interfaces"
    status: "Interfaces estado"
    ip: "IP"
    prefix: "Red IP"
    mac: "MAC"

  interface_status_map:
    "up": true
    "down": false


# ── Columnas principales del inventario ──────────────────────
# Nombres exactos de las columnas utilizadas por el exportador.
# Estos valores deben coincidir con los encabezados de
# merged_inventory.csv.

inventory_columns:
  machine_name: "Nombre maquina"
  machine_type: "Tipo de maquina"
  os: "SO Host"


# ── Valores vacíos ─────────────────────────────────────────
# Valores vacíos que se consideran equivalentes a None/N/A y 
# se omiten en la exportación.

empty_values:
  - "N/A"
  - ""
  - "None"
  - "n/a"
  - "none"