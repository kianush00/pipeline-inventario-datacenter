# netbox_mapping.yaml
# ====================
# Contrato de exportación entre merged_inventory.csv y NetBox 4.6+.
# Leído exclusivamente por export_to_netbox.py.
# No depende de rundeck_header_list.txt.
#
# ── Credenciales ─────────────────────────────────────────────
# Se leen desde variables de entorno (nunca en este archivo):
#   NETBOX_URL        → URL de NetBox
#   NETBOX_TOKEN      → token con permisos write sobre
#                       dcim, virtualization, ipam, extras, core
#   NETBOX_VERIFY_SSL → "true" / "false" (por defecto: true)

# ── Columnas del inventario (Centralizadas) ──────────────────
# Nombres exactos de las columnas utilizadas por el exportador.
# Se definen anclas (&) para reutilizar como alias (*) en todo el archivo.

centralized_columns:
  machine_name: &col_nombre_maquina "Nombre maquina"
  machine_type: &col_tipo_maquina "Tipo de maquina"
  os: &col_so_host "SO Host"
  status: "Estado"
  role: "Rol"
  manufacturer: "Marca"
  model: "Modelo"
  rack: &col_rack "Rack"
  cluster: "Host/Cluster/Chassis"
  cores: &col_cores "Cores"
  uuid: &col_uuid "UUID"

# Columnas adicionales del CSV referenciadas en mappings
csv_extra_columns:
  serial: &col_serial "Serial Number"
  asset_tag: &col_asset_tag "Nro Inventario"
  pos_u: &col_pos_u "Posicion (U)"
  alt_u: &col_alt_u "Altura (U)"
  desc: &col_desc "Descripcion"
  notes: &col_notas "Notas"
  env: &col_entorno "Entorno"
  service_tag: &col_service_tag "Service Tag"
  cpu_model: &col_cpu_modelo "CPU Modelo"
  threads: &col_threads "Threads"
  sockets: &col_sockets "Sockets"
  disks: &col_discos "Discos"
  raid: &col_raid "RAID"
  bios_ver: &col_bios_ver "Version BIOS"
  bios_date: &col_bios_date "Fecha BIOS"
  rundeck_node: &col_nodo_rundeck "Nodo Rundeck"
  ram_gb: &col_ram_gb "RAM (GB)"
  disk_cap: &col_disk_cap "Capacidad visible (GB)"
  iface_names: &col_ifaces "Interfaces"
  iface_status: &col_ifaces_status "Interfaces estado"
  iface_ip: &col_ip "IP"
  iface_pfx: &col_pfx "Red IP"
  iface_mac: &col_mac "MAC"

# ── Site único ───────────────────────────────────────────────
# Todos los objetos se asignan a este site.
# Si no existe en NetBox, el script lo crea automáticamente.
site:
  name: "Datacenter Principal"
  slug: "datacenter-principal"

# ── ClusterType ──────────────────────────────────────────────
# Las VMs se agrupan en un Cluster cuyo nombre coincide con el
# valor del campo 'Host/Cluster/Chassis' en el CSV.
# El cluster_type se crea automáticamente si no existe.
cluster_type:
  name: "Hipervisor"
  slug: "hipervisor"

# ── Roles de dispositivo ─────────────────────────────────────
# Lista canónica de Device Roles utilizados por Devices y VMs.
# El valor de 'Rol' del CSV debe coincidir con uno de estos nombres.
# Los roles se crean automáticamente si no existen.
# Los colores son valores hexadecimales sin '#'.
device_roles:
  - name: "Hypervisor"
    slug: "hypervisor"
    color: "9c27b0"
  - name: "DNS Server"
    slug: "dns-server"
    color: "2196f3"
  - name: "DHCP Server"
    slug: "dhcp-server"
    color: "2196f3"
  - name: "Mail Server"
    slug: "mail-server"
    color: "009688"
  - name: "Database Server"
    slug: "database-server"
    color: "f44336"
  - name: "Web Server"
    slug: "web-server"
    color: "4caf50"
  - name: "Application Server"
    slug: "application-server"
    color: "8bc34a"
  - name: "Storage Server"
    slug: "storage-server"
    color: "ff9800"
  - name: "Backup Server"
    slug: "backup-server"
    color: "795548"
  - name: "Monitoring Server"
    slug: "monitoring-server"
    color: "00bcd4"
  - name: "Management Server"
    slug: "management-server"
    color: "607d8b"
  - name: "Authentication Server"
    slug: "authentication-server"
    color: "673ab7"
  - name: "Proxy Server"
    slug: "proxy-server"
    color: "ff5722"
  - name: "Repository Server"
    slug: "repository-server"
    color: "cddc39"
  - name: "Logging Server"
    slug: "logging-server"
    color: "9e9e9e"
  - name: "VPN Server"
    slug: "vpn-server"
    color: "3f51b5"
  - name: "File Server"
    slug: "file-server"
    color: "ffeb3b"
  - name: "Tape Drive"
    slug: "tape-drive"
    color: "795548"
  - name: "Chassis"
    slug: "chassis"
    color: "607d8b"
  - name: "Container Host"
    slug: "container-host"
    color: "00bcd4"
  - name: "Network/Firewall Device"
    slug: "network-firewall-device"
    color: "f44336"
  - name: "Others"
    slug: "others"
    color: "9e9e9e"

# ── Tipo de máquina ──────────────────────────────────────────
# Clasificación interna del inventario.
# Se conserva exactamente como aparece en el CSV.
# Se almacena en NetBox como Custom Field de tipo Selection.
machine_type:
  field_name: "machine_type"
  label: "Tipo de maquina"
  type: "selection"
  required: true
  object_types:
    - "dcim.device"
    - "virtualization.virtualmachine"
  choice_set:
    name: "Machine Type"
    choices:
      - value: "Dedicada"
        label: "Dedicada"
      - value: "Hipervisor"
        label: "Hipervisor"
      - value: "VM"
        label: "VM"

# ── Entorno ──────────────────────────────────────────────────
# Representa el entorno lógico en el que opera el nodo.
# Se almacena como Custom Field de tipo Selection.
environment:
  field_name: "environment"
  label: "Entorno"
  type: "selection"
  required: false
  object_types:
    - "dcim.device"
    - "virtualization.virtualmachine"
  choice_set:
    name: "Environment"
    choices:
      - value: "production"
        label: "Producción"
      - value: "certification"
        label: "Certificación"
      - value: "development"
        label: "Desarrollo"

environment_map:
  "Producción": "production"
  "Certificación": "certification"
  "Desarrollo": "development"

# ── Tipo de máquina → modelo NetBox ──────────────────────────
# Determina si la fila se exporta como Device o VirtualMachine.
machine_type_map:
  "Dedicada": "device"
  "Hipervisor": "device"
  "VM": "virtual_machine"

# ── Estado → NetBox status ───────────────────────────────────
# 'Estado' del inventario maestro utiliza directamente la
# semántica del campo status de NetBox.
#
# Valores admitidos:
#   active
#   planned
#   staged
#   failed
#   inventory
#   decommissioning
#   offline
#
# El valor almacenado en el CSV está en español y se transforma
# al valor interno utilizado por NetBox.
#
# Si el valor recibido no está definido en este mapa, el script
# deberá aplicar el fallback correspondiente al tipo de objeto:
#   Device           → inventory
#   VirtualMachine   → staged
status_map:
  "Activo": "active"
  "Planificado": "planned"
  "En preparación": "staged"
  "Fallido": "failed"
  "En inventario": "inventory"
  "En baja": "decommissioning"
  "Fuera de línea": "offline"

status_defaults:
  device: "inventory"
  virtual_machine: "staged"

# ── Custom Fields ────────────────────────────────────────────
# El script garantiza que estos custom fields existen en NetBox.
#
# Los campos de tipo "selection" utilizan choice_set para definir
# sus valores válidos.
#
# NOTA NetBox 4.6+:
#   - El campo se llama "object_types".
#   - Los tipos se referencian mediante app_label.model.
#   - Los Custom Fields de selección utilizan Choice Sets.

custom_fields:
  - name: "inventory_uuid"
    label: "UUID de inventario"
    type: "text"
    required: false
    object_types:
      - "dcim.device"
      - "virtualization.virtualmachine"

  - name: "service_tag"
    label: "Service Tag"
    type: "text"
    required: false
    object_types:
      - "dcim.device"

  - name: "cpu_model"
    label: "Modelo CPU"
    type: "text"
    required: false
    object_types:
      - "dcim.device"
      - "virtualization.virtualmachine"

  - name: "cpu_cores"
    label: "Cores CPU"
    type: "integer"
    required: false
    object_types:
      - "dcim.device"
      - "virtualization.virtualmachine"

  - name: "cpu_threads"
    label: "Threads CPU"
    type: "integer"
    required: false
    object_types:
      - "dcim.device"

  - name: "cpu_sockets"
    label: "Sockets CPU"
    type: "integer"
    required: false
    object_types:
      - "dcim.device"

  - name: "disks"
    label: "Discos"
    type: "text"
    required: false
    object_types:
      - "dcim.device"
      - "virtualization.virtualmachine"

  - name: "raid"
    label: "RAID"
    type: "text"
    required: false
    object_types:
      - "dcim.device"

  - name: "bios_version"
    label: "Versión BIOS"
    type: "text"
    required: false
    object_types:
      - "dcim.device"

  - name: "bios_date"
    label: "Fecha BIOS"
    type: "text"
    required: false
    object_types:
      - "dcim.device"

  - name: "rundeck_node"
    label: "Nodo Rundeck"
    type: "boolean"
    required: false
    default: false # por defecto es false, o sea que no es un nodo de rundeck
    object_types:
      - "dcim.device"
      - "virtualization.virtualmachine"

# ── Campos nativos de Device (DCIM) ──────────────────────────
# 'source' → nombre exacto de la columna en merged_inventory.csv.
# 'target' → campo en el API de NetBox.
# 'skip_if_empty' → no enviar el campo si el valor es vacío.

device_fields:
  - source: *col_nombre_maquina
    target: "name"
    skip_if_empty: false

  - source: *col_serial
    target: "serial"
    skip_if_empty: true

  - source: *col_asset_tag
    target: "asset_tag"
    skip_if_empty: true

  - source: *col_rack
    target: "rack"
    skip_if_empty: true

  - source: *col_pos_u
    target: "position"
    skip_if_empty: true
    cast: "int"

  - source: *col_alt_u
    target: "_u_height"
    skip_if_empty: true
    cast: "int"

  - source: *col_so_host
    target: "platform"
    skip_if_empty: true

  - source: [*col_desc, *col_notas]
    target: "description"
    transform: "concat_dot"
    skip_if_empty: true

# ── Campos específicos de Device ─────────────────────────────
device_custom_fields:
  - source: *col_uuid
    target: "inventory_uuid"
    skip_if_empty: true

  - source: *col_tipo_maquina
    target: "machine_type"
    skip_if_empty: false

  - source: *col_entorno
    target: "environment"
    skip_if_empty: true
    map: "environment_map"

  - source: *col_service_tag
    target: "service_tag"
    skip_if_empty: true

  - source: *col_cpu_modelo
    target: "cpu_model"
    skip_if_empty: true

  - source: *col_cores
    target: "cpu_cores"
    skip_if_empty: true
    cast: "int"

  - source: *col_threads
    target: "cpu_threads"
    skip_if_empty: true
    cast: "int"

  - source: *col_sockets
    target: "cpu_sockets"
    skip_if_empty: true
    cast: "int"

  - source: *col_discos
    target: "disks"
    skip_if_empty: true

  - source: *col_raid
    target: "raid"
    skip_if_empty: true

  - source: *col_bios_ver
    target: "bios_version"
    skip_if_empty: true

  - source: *col_bios_date
    target: "bios_date"
    skip_if_empty: true

  - source: *col_nodo_rundeck
    target: "rundeck_node"
    skip_if_empty: true
    cast: "bool_si_no"

# ── Campos nativos de VirtualMachine ─────────────────────────
vm_fields:
  - source: *col_nombre_maquina
    target: "name"
    skip_if_empty: false

  - source: *col_so_host
    target: "platform"
    skip_if_empty: true

  - source: *col_ram_gb
    target: "memory"
    skip_if_empty: true
    cast: "int_gb_to_mb"

  - source: *col_disk_cap
    target: "disk"
    skip_if_empty: true
    cast: "int"

  - source: [*col_desc, *col_notas]
    target: "description"
    transform: "concat_dot"
    skip_if_empty: true

# ── Campos específicos de VirtualMachine ─────────────────────
vm_custom_fields:
  - source: *col_uuid
    target: "inventory_uuid"
    skip_if_empty: true

  - source: *col_tipo_maquina
    target: "machine_type"
    skip_if_empty: false

  - source: *col_entorno
    target: "environment"
    skip_if_empty: true
    map: "environment_map"

  - source: *col_cpu_modelo
    target: "cpu_model"
    skip_if_empty: true

  - source: *col_cores
    target: "cpu_cores"
    skip_if_empty: true
    cast: "int"

  - source: *col_discos
    target: "disks"
    skip_if_empty: true

  - source: *col_nodo_rundeck
    target: "rundeck_node"
    skip_if_empty: true
    cast: "bool_si_no"

# ── Interfaces de red ─────────────────────────────────────────
# Las cinco columnas de red se parsean en paralelo por posición.
#
# Si los arrays resultantes no tienen la misma longitud, la
# sincronización de interfaces de esa fila se omite.
# El Device/VM se sincroniza de todas formas.

network:
  columns:
    names: *col_ifaces
    status: *col_ifaces_status
    ip: *col_ip
    prefix: *col_pfx
    mac: *col_mac

  interface_status_map:
    "up": true
    "down": false

# ── Valores vacíos ─────────────────────────────────────────
# Valores vacíos que se consideran equivalentes a None/N/A y
# se omiten en la exportación.

empty_values:
  - "N/A"
  - ""
  - "None"
  - "n/a"
  - "none"
