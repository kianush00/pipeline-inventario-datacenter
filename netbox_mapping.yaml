# ── Mapeo de Entorno ─────────────────────────────────────────
# Transforma los valores de entorno del CSV al slug/valor interno
# admitido por el Choice Set del Custom Field en NetBox.
#
# NOTA: Cualquier diccionario en la raíz del YAML cuya clave termine
# en `_map` (ej. environment_map) será detectado y registrado automáticamente
# por el script como un mapa de resolución. Puedes utilizar estos mapas
# referenciándolos con la propiedad `map: "nombre_del_mapa"` en la definición
# de los campos del dispositivo o VM.
environment_map:
  "Producción": "production"
  "Certificación": "certification"
  "Desarrollo": "development"

# ── Tipo de máquina → modelo NetBox ──────────────────────────
# Determina si la fila se exporta como Device o VirtualMachine.
machine_type_map:
  "Dedicada": "device"
  "Hipervisor": "device"
  "VM": "virtual_machine"

# ── Estado → NetBox status ───────────────────────────────────
# 'Estado' del inventario maestro utiliza directamente la
# semántica del campo status de NetBox.
#
# Valores admitidos por NetBox:
#   active          → Operativo y en producción
#   planned         → Proyectado o pendiente de instalación
#   staged          → En preparación o preconfiguración
#   failed          → Con fallas o fuera de servicio por fallos
#   inventory       → Almacenado como repuesto o stock disponible
#   decommissioning → En proceso de desmantelamiento o retiro
#   offline         → Apagado o temporalmente inaccesible
#
# El valor almacenado en el CSV está en español y se transforma
# al valor interno utilizado por NetBox.
#
# Si el valor recibido no está definido en este mapa, el script
# deberá aplicar el fallback correspondiente al tipo de objeto:
#   Device           → inventory
#   VirtualMachine   → staged
status_map:
  "Activo": "active"
  "Planificado": "planned"
  "En preparación": "staged"
  "Fallido": "failed"
  "En inventario": "inventory"
  "En baja": "decommissioning"
  "Fuera de línea": "offline"

status_defaults:
  device: "inventory"
  virtual_machine: "staged"

# ── Definiciones de Custom Fields (Esquema DDL) ──────────────
# El script garantiza que estos custom fields existen en NetBox.
# Esta sección DEFINE la estructura de los campos en la base de datos
# de NetBox (creación si no existen). NO extrae datos del CSV.
#
# Significado de los campos:
# 'name'         → (Requerido) Nombre interno (slug) del custom field en NetBox.
# 'label'        → (Requerido) Nombre descriptivo mostrado en la interfaz web.
# 'type'         → (Requerido) Tipo de dato (ver lista de soportados abajo).
# 'required'     → (Requerido) Si es true, el campo será obligatorio en el esquema
#                    interno (DDL) de NetBox. NO afecta el parseo ni la validación del CSV.
# 'object_types' → (Requerido) Lista de modelos NetBox a los que aplica
#                    (ej. "dcim.device", "virtualization.virtualmachine").
# 'default'      → (Opcional) Valor por defecto a nivel de base de datos.
# 'choice_set'   → (Opcional) Define los valores válidos. Obligatorio si type="selection".
#
# Tipos de Custom Field soportados por NetBox 4.6+:
#   text           → Texto libre
#   longtext       → Texto largo (textarea)
#   integer        → Número entero
#   decimal        → Número decimal
#   boolean        → Verdadero/Falso
#   date           → Fecha (YYYY-MM-DD)
#   datetime       → Fecha y hora
#   url            → URL válida
#   json           → JSON arbitrario
#   select         → Selección única (requiere choice_set)
#   multiselect    → Selección múltiple (requiere choice_set)
#   object         → Referencia a otro objeto NetBox
#   multiobject    → Referencia múltiple a objetos NetBox

custom_field_definitions:
  - name: "machine_type"
    label: "Tipo de maquina"
    type: "select"
    required: true
    object_types:
      - "dcim.device"
      - "virtualization.virtualmachine"
    choice_set:
      name: "Machine Type"
      choices:
        - value: "Dedicada"
          label: "Dedicada"
        - value: "Hipervisor"
          label: "Hipervisor"
        - value: "VM"
          label: "VM"

  - name: "environment"
    label: "Entorno"
    type: "select"
    required: false
    object_types:
      - "dcim.device"
      - "virtualization.virtualmachine"
    choice_set:
      name: "Environment"
      choices:
        - value: "production"
          label: "Producción"
        - value: "certification"
          label: "Certificación"
        - value: "development"
          label: "Desarrollo"

  - name: "inventory_uuid"
    label: "UUID de inventario"
    type: "text"
    required: false
    object_types:
      - "dcim.device"
      - "virtualization.virtualmachine"

  - name: "service_tag"
    label: "Service Tag"
    type: "text"
    required: false
    object_types:
      - "dcim.device"

  - name: "cpu_model"
    label: "Modelo CPU"
    type: "text"
    required: false
    object_types:
      - "dcim.device"
      - "virtualization.virtualmachine"

  - name: "cpu_cores"
    label: "Cores CPU"
    type: "integer"
    required: false
    object_types:
      - "dcim.device"
      - "virtualization.virtualmachine"

  - name: "cpu_threads"
    label: "Threads CPU"
    type: "integer"
    required: false
    object_types:
      - "dcim.device"

  - name: "cpu_sockets"
    label: "Sockets CPU"
    type: "integer"
    required: false
    object_types:
      - "dcim.device"

  - name: "disks"
    label: "Discos"
    type: "text"
    required: false
    object_types:
      - "dcim.device"
      - "virtualization.virtualmachine"

  - name: "raid"
    label: "RAID"
    type: "text"
    required: false
    object_types:
      - "dcim.device"

  - name: "bios_version"
    label: "Versión BIOS"
    type: "text"
    required: false
    object_types:
      - "dcim.device"

  - name: "bios_date"
    label: "Fecha BIOS"
    type: "text"
    required: false
    object_types:
      - "dcim.device"

  - name: "rundeck_node"
    label: "Nodo Rundeck"
    type: "boolean"
    required: false
    default: false
    object_types:
      - "dcim.device"
      - "virtualization.virtualmachine"

  - name: "os_version"
    label: "Version SO Host"
    type: "text"
    required: false
    object_types:
      - "dcim.device"
      - "virtualization.virtualmachine"

  - name: "hypervisor_os"
    label: "SO Hipervisor"
    type: "text"
    required: false
    object_types:
      - "dcim.device"

  - name: "hypervisor_version"
    label: "Version SO Hipervisor"
    type: "text"
    required: false
    object_types:
      - "dcim.device"

# ── Mapeo de Campos Nativos de Device (DCIM) ─────────────────
# Sección DML: define cómo EXTRAER datos del CSV y MAPEARLOS a
# campos nativos de la API de NetBox para objetos Device.
#
# 'source'      → (Requerido) nombre exacto de la columna en merged_inventory.csv.
# 'target'      → (Requerido) campo en el API de NetBox.
# 'is_optional' → (Requerido) Si es true, omite el campo si el valor está vacío.
#                  Si es false, el valor es obligatorio (Fail-Fast si falta).
# 'is_unique'   → (Opcional) Si es true, un string vacío se sanitiza a null para
#                  evitar violaciones de constraint UNIQUE en NetBox.
# 'cast'        → (Opcional) Funciones de conversión permitidas: int, int_gb_to_mb, bool_si_no.
# 'transform'   → (Opcional) Operaciones de estructura: concat_dot (concatena lista con '.').
# 'map'         → (Opcional) Diccionario declarado en este yaml para traducir valores.
#
# NOTA: Claves foráneas como 'site', 'role', 'platform', 'rack' y
# 'device_type' son resueltas a objetos/IDs NetBox por sus respectivas
# funciones especializadas en el script, por lo que no forman parte de esta lista.

device_native_mappings:
  - source: *col_nombre_maquina
    target: "name"
    is_optional: false

  - source: *col_serial
    target: "serial"
    is_optional: true
    is_unique: true

  - source: *col_asset_tag
    target: "asset_tag"
    is_optional: true
    is_unique: true

  - source: *col_pos_u
    target: "position"
    is_optional: true
    cast: "int"

  - source: [*col_desc, *col_notas]
    target: "description"
    transform: "concat_dot"
    is_optional: true

# ── Mapeo de Custom Fields de Device ─────────────────────────
# Sección DML: define cómo EXTRAER datos del CSV y MAPEARLOS a
# Custom Fields de la API de NetBox para objetos Device.
# Los valores resultantes se empaquetan dentro del sub-diccionario
# "custom_fields" del payload JSON.
device_custom_mappings:
  - source: *col_uuid
    target: "inventory_uuid"
    is_optional: true

  - source: *col_tipo_maquina
    target: "machine_type"
    is_optional: false

  - source: *col_entorno
    target: "environment"
    is_optional: true
    map: "environment_map"

  - source: *col_service_tag
    target: "service_tag"
    is_optional: true

  - source: *col_cpu_modelo
    target: "cpu_model"
    is_optional: true

  - source: *col_cores
    target: "cpu_cores"
    is_optional: true
    cast: "int"

  - source: *col_threads
    target: "cpu_threads"
    is_optional: true
    cast: "int"

  - source: *col_sockets
    target: "cpu_sockets"
    is_optional: true
    cast: "int"

  - source: *col_discos
    target: "disks"
    is_optional: true

  - source: *col_raid
    target: "raid"
    is_optional: true

  - source: *col_bios_ver
    target: "bios_version"
    is_optional: true

  - source: *col_bios_date
    target: "bios_date"
    is_optional: true

  - source: *col_nodo_rundeck
    target: "rundeck_node"
    is_optional: true
    cast: "bool_si_no"

  - source: *col_so_ver
    target: "os_version"
    is_optional: true

  - source: *col_hip_os
    target: "hypervisor_os"
    is_optional: true

  - source: *col_hip_ver
    target: "hypervisor_version"
    is_optional: true

# ── Mapeo de Campos Nativos de VirtualMachine ────────────────
# Sección DML: define cómo EXTRAER datos del CSV y MAPEARLOS a
# campos nativos de la API de NetBox para objetos VirtualMachine.
# NOTA: Claves foráneas como 'site', 'role', 'platform', 'cluster' y 'device'
# son resueltas a objetos/IDs NetBox por funciones especializadas en el script.

vm_native_mappings:
  - source: *col_nombre_maquina
    target: "name"
    is_optional: false

  - source: *col_ram_gb
    target: "memory"
    is_optional: true
    cast: "int_gb_to_mb"

  - source: *col_disk_cap
    target: "disk"
    is_optional: true
    cast: "int"

  - source: [*col_desc, *col_notas]
    target: "description"
    transform: "concat_dot"
    is_optional: true

# ── Mapeo de Custom Fields de VirtualMachine ─────────────────
# Sección DML: define cómo EXTRAER datos del CSV y MAPEARLOS a
# Custom Fields de la API de NetBox para objetos VirtualMachine.
vm_custom_mappings:
  - source: *col_uuid
    target: "inventory_uuid"
    is_optional: true

  - source: *col_tipo_maquina
    target: "machine_type"
    is_optional: false

  - source: *col_entorno
    target: "environment"
    is_optional: true
    map: "environment_map"

  - source: *col_cpu_modelo
    target: "cpu_model"
    is_optional: true

  - source: *col_cores
    target: "cpu_cores"
    is_optional: true
    cast: "int"

  - source: *col_discos
    target: "disks"
    is_optional: true

  - source: *col_nodo_rundeck
    target: "rundeck_node"
    is_optional: true
    cast: "bool_si_no"

  - source: *col_so_ver
    target: "os_version"
    is_optional: true

# ── Interfaces de red ─────────────────────────────────────────
# Las cinco columnas de red se parsean en paralelo por posición,
# separando cada celda por comas.
#
# Ejemplo de una fila del CSV:
#   Interfaces:         "eth0, eth1, eth2"
#   Interfaces estado:  "up, down, down"
#   IP:                 "136.12.34.147, N/A, N/A"
#   Red IP:             "136.12.34.128/26, N/A, N/A"
#   MAC:                "ab:cd:ef:01:23:45, de:ad:be:ef:12:34, 12:ab:cd:ef:56:78"
#
# Reglas de validación:
#   - La columna "Interfaces" (names) define la cantidad de interfaces.
#   - Las demás columnas deben tener exactamente la misma cantidad de
#     elementos separados por comas, o estar completamente vacías.
#   - Una columna completamente vacía indica que ninguna interfaz
#     tiene ese dato (ej. todas las IPs son N/A o están en blanco).
#   - Si una columna tiene datos pero su cantidad de elementos difiere
#     de la cantidad de interfaces, la fila se descarta para interfaces
#     (el Device/VM se sincroniza de todas formas).
#
# Columna "Red IP" (prefix):
#   Contiene la red o máscara asociada a cada IP. Se combina con la
#   columna "IP" para construir el CIDR que NetBox requiere en su API
#   (campo `address` de IP Address: POST /api/ipam/ip-addresses/).
#
#   Formatos soportados:
#     - Red/Prefijo:  "136.12.34.128/26"          → se extrae "26"
#     - Red/Máscara:  "192.168.1.0/255.255.255.0" → se extrae "255.255.255.0"
#     - Prefijo solo: "26"                        → se usa directamente
#     - Máscara sola: "255.255.255.0"             → se usa directamente
#
#   En todos los casos, el script normaliza al formato CIDR canónico
#   (ej. "136.12.34.147/26") antes de enviarlo a NetBox.
#
# Columna "IP":
#   Dirección IPv4 sin máscara.
#
# Columna "MAC":
#   Dirección MAC en formato estándar (ej. "ab:cd:ef:01:23:45").

network:
  columns:
    names: *col_ifaces
    status: *col_ifaces_status
    ip: *col_ip
    prefix: *col_pfx
    mac: *col_mac

  interface_status_map:
    "up": true
    "down": false

# ── Valores vacíos ─────────────────────────────────────────
# Valores vacíos que se consideran equivalentes a None/N/A y
# se omiten en la exportación.

empty_values:
  - "N/A"
  - ""
  - "None"
  - "n/a"
  - "none"
  - "-----"
  - "------"
  - "-------"
