# netbox_mapping.yaml
# ====================
# Contrato de exportación entre merged_inventory.csv y NetBox 4.6+.
# Leído exclusivamente por export_to_netbox.py.
# No depende de rundeck_header_list.txt.
#
# ── Credenciales ─────────────────────────────────────────────
# Se leen desde variables de entorno (nunca en este archivo):
#   NETBOX_URL            → URL de NetBox
#   NETBOX_TOKEN          → token con permisos write sobre
#                           dcim, virtualization, ipam, extras, core
#   NETBOX_VERIFY_SSL     → "true" / "false" (por defecto: true)
#   NETBOX_SITE_NAME      → nombre del Site de NetBox

# ── Alias de columnas del CSV ────────────────────────────────
# Glosario centralizado de todos los nombres de columnas del
# archivo merged_inventory.csv que utiliza el exportador.
#
# Cada entrada define:
#   - Una clave semántica (ej. machine_name) usada en el script Python.
#   - Un ancla YAML (&col_id) para reutilizar como alias (*col_id)
#     en las secciones de mapeo más abajo.
#   - El nombre textual exacto de la columna en el CSV.
#
# Formato de celdas esperado (Input Format):
# - Campos simples (Strings, Números): El valor directo. Se le aplicará .strip()
# - Campos múltiples (ej. Interfaces, IP, MAC): Lista de valores separados por coma (,).
#   El script hace split(",") y asocia los elementos según su índice.
# - Valores nulos/vacíos: Si el valor de la celda coincide con algún elemento de
#   la lista `empty_values` (al final de este archivo), se tratará como "vacío" (N/A)
#   y no se enviará a NetBox, salvo que sea obligatorio.

csv_column_aliases:
  machine_name: &col_nombre_maquina "Nombre maquina"
  machine_type: &col_tipo_maquina "Tipo de maquina"
  os: "SO Host"
  status: &col_estado "Estado"
  role: "Rol"
  manufacturer: &col_marca "Marca"
  model: &col_modelo "Modelo"
  rack: "Rack"
  cluster: &col_cluster "Host/Cluster/Chassis"
  cores: &col_cores "Cores"
  uuid: &col_uuid "UUID"
  os_ver: &col_so_ver "Version SO Host"
  hypervisor_os: &col_hip_os "SO Hipervisor"
  hypervisor_ver: &col_hip_ver "Version SO Hipervisor"
  serial: &col_serial "Serial Number"
  asset_tag: &col_asset_tag "Nro Inventario"
  pos_u: &col_pos_u "Posicion (U)"
  alt_u: "Altura (U)"
  desc: &col_desc "Descripcion"
  notes: &col_notas "Notas"
  env: &col_entorno "Entorno"
  service_tag: &col_service_tag "Service Tag"
  cpu_model: &col_cpu_modelo "CPU Modelo"
  threads: &col_threads "Threads"
  sockets: &col_sockets "Sockets"
  disks: &col_discos "Discos"
  raid: &col_raid "RAID"
  bios_ver: &col_bios_ver "Version BIOS"
  bios_date: &col_bios_date "Fecha BIOS"
  rundeck_node: &col_nodo_rundeck "Nodo Rundeck"
  ram_gb: &col_ram_gb "RAM (GB)"
  disk_cap: &col_disk_cap "Capacidad visible (GB)"
  iface_names: &col_ifaces "Interfaces"
  iface_status: &col_ifaces_status "Interfaces estado"
  iface_ip: &col_ip "IP"
  iface_pfx: &col_pfx "Red IP"
  iface_mac: &col_mac "MAC"

# ── Columnas obligatorias del CSV (Presencia en cabecera) ────
# Columnas cuya presencia en el encabezado del CSV es indispensable (bloqueante).
# Esto valida la *existencia del encabezado* en el CSV, no que el *valor de la celda*
# deba estar obligatoriamente lleno en todas las filas.
# Si alguna falta en la primera fila, el script aborta inmediatamente.
required_columns:
  - *col_nombre_maquina
  - *col_tipo_maquina
  - *col_uuid
  - *col_estado
  - *col_marca
  - *col_modelo
  - *col_cluster

# ── Site único ───────────────────────────────────────────────
# Todos los objetos se asignan a este site.
# Si no existe en NetBox, el script lo crea automáticamente.
# Para evitar errores con espacios y caracteres especiales, el slug
# se procesa a partir del nombre.
site:
  name: "${NETBOX_SITE_NAME}"
  slug: "${NETBOX_SITE_NAME}"

# ── ClusterType ──────────────────────────────────────────────
# Las VMs se agrupan en un Cluster cuyo nombre coincide con el
# valor del campo 'cluster' en el CSV.
# El cluster_type se crea automáticamente si no existe.
cluster_type:
  name: "Hipervisor"
  slug: "hipervisor"

# ── Roles de dispositivo ─────────────────────────────────────
# Lista canónica de Device Roles utilizados por Devices y VMs.
# El valor de 'Rol' del CSV debe coincidir con uno de estos nombres.
# Los roles se crean automáticamente si no existen.
# Los colores son valores hexadecimales sin '#'.
device_roles:
