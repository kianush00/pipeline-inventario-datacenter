# netbox_mapping.yaml
# ====================
# Contrato de exportación entre merged_inventory.csv y NetBox 4.6+.
# Leído exclusivamente por export_to_netbox.py.
# No depende de rundeck_header_list.txt.
#
# ── Credenciales ─────────────────────────────────────────────
# Se leen desde variables de entorno (nunca en este archivo):
#   NETBOX_URL            → URL de NetBox
#   NETBOX_TOKEN          → token con permisos write sobre
#                           dcim, virtualization, ipam, extras, core
#   NETBOX_VERIFY_SSL     → "true" / "false" (por defecto: true)
#   NETBOX_SITE_NAME      → nombre del Site de NetBox

# ── Definición de columnas del CSV ─────────────────────────────
# Glosario centralizado de todos los campos del
# archivo merged_inventory.csv que utiliza el exportador.
#
# Cada entrada define:
#   - Una clave semántica (ej. machine_name) usada en el script Python.
#   - Un subcampo `source` con el nombre textual exacto de la columna en el CSV.
#     Puede incluir un ancla YAML (&col_id) para reutilizarlo en el mapeo inferior.
#   - Un subcampo opcional `required: true` si la columna es obligatoria.
#
# Formato de celdas esperado (Input Format):
# - Campos simples (Strings, Números): El valor directo. Se le aplicará .strip()
# - Campos múltiples (ej. Interfaces, IP, MAC): Lista de valores separados por coma (,).
#   El script hace split(",") y asocia los elementos según su índice.
# - Valores nulos/vacíos: Si el valor de la celda coincide con algún elemento de
#   la lista `empty_values` (al final de este archivo), se tratará como "vacío" (N/A)
#   y no se enviará a NetBox, salvo que sea obligatorio.
#
# ── Columnas obligatorias del CSV (Presencia en cabecera) ────
# Las columnas con el subcampo `required: true` son aquellas cuya presencia
# en el encabezado del CSV es indispensable (bloqueante).
# Esto valida la *existencia del encabezado* en el CSV, no que el *valor de la celda*
# deba estar obligatoriamente lleno en todas las filas.
# Si alguna falta en el encabezado, el script aborta inmediatamente.

csv_columns:
  machine_name:
    source: &col_machine_name "Nombre maquina"
    required: true
  machine_type:
    source: &col_machine_type "Tipo de maquina"
    required: true
    map:
      "Dedicada": "device"
      "Hipervisor": "device"
      "VM": "virtual_machine"
  os:
    source: "SO Host"
  status:
    source: "Estado"
    map:
      "Activo": "active"
      "Planificado": "planned"
      "En preparación": "staged"
      "Fallido": "failed"
      "En inventario": "inventory"
      "En baja": "decommissioning"
      "Fuera de línea": "offline"
  role:
    source: "Rol"
  manufacturer:
    source: "Marca"
    required: true
  model:
    source: "Modelo"
    required: true
  rack:
    source: "Rack"
  host_device:
    source: "Dispositivo Host"
  cluster_name:
    source: "Cluster"
    required: true
  cores:
    source: &col_cpu_cores "Cores"
  inventory_uuid:
    source: &col_inventory_uuid "UUID"
    required: true
  os_ver:
    source: &col_os_version "Version SO Host"
  hypervisor_os:
    source: &col_hypervisor_os "SO Hipervisor"
  hypervisor_ver:
    source: &col_hypervisor_version "Version SO Hipervisor"
  serial:
    source: &col_serial "Serial Number"
  asset_tag:
    source: &col_asset_tag "Nro Inventario"
  pos_u:
    source: &col_pos_u "Posicion (U)"
  alt_u:
    source: "Altura (U)"
  desc:
    source: &col_desc "Descripcion"
  notes:
    source: &col_notes "Notas"
  environment:
    source: &col_environment "Entorno"
    map:
      "Producción": "production"
      "Certificación": "certification"
      "Desarrollo": "development"
  service_tag:
    source: &col_service_tag "Service Tag"
  cpu_model:
    source: &col_cpu_model "CPU Modelo"
  threads:
    source: &col_cpu_threads "Threads"
  sockets:
    source: &col_cpu_sockets "Sockets"
  disks:
    source: &col_disks "Discos"
  raid:
    source: &col_raid "RAID"
  bios_ver:
    source: &col_bios_version "Version BIOS"
  bios_date:
    source: &col_bios_date "Fecha BIOS"
  rundeck_node:
    source: &col_rundeck_node "Nodo Rundeck"
  ram_gb:
    source: &col_ram_gb "RAM (GB)"
  disk_cap:
    source: &col_disk_cap "Capacidad visible (GB)"
  iface_names:
    source: &col_ifaces "Interfaces"
  iface_status:
    source: &col_ifaces_status "Interfaces estado"
    map:
      "up": true
      "down": false
  iface_ip:
    source: &col_ip "IP"
  iface_pfx:
    source: &col_pfx "Red IP"
  iface_mac:
    source: &col_mac "MAC"

# ── Site único ───────────────────────────────────────────────
# Si no existe en NetBox, el script lo crea automáticamente.
# Para evitar errores con espacios y caracteres especiales, el slug
# se procesa a partir del nombre.
site:
  name: "${NETBOX_SITE_NAME}"
  slug: "${NETBOX_SITE_NAME}"

# ── ClusterType ──────────────────────────────────────────────
# Las VMs se agrupan en un Cluster cuyo nombre coincide con el
# valor del campo 'Cluster' en el CSV.
# El cluster_type se crea automáticamente si no existe.
cluster_type:
  default:
    name: "Hipervisor"
    slug: "hipervisor"

# ── Roles de dispositivo ─────────────────────────────────────
# Lista canónica de Device Roles utilizados por Devices y VMs.
# El valor de 'Rol' del CSV debe coincidir con uno de estos nombres.
# Los roles se crean automáticamente si no existen.
# Los colores son valores hexadecimales sin '#'.
