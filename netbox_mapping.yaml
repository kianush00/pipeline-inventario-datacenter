# ── Custom Fields (Esquema DDL, ver docs/netbox_mapping.md) ──
custom_field_definitions:
  - name: &cf_machine_type "machine_type"
    label: "Tipo de maquina"
    type: "select"
    required: true
    object_types:
      - "dcim.device"
      - "virtualization.virtualmachine"
    choice_set:
      name: "Machine Type"
      choices:
        - value: "dedicated"
          label: "Dedicada"
        - value: "hypervisor"
          label: "Hipervisor"
        - value: "vm"
          label: "VM"

  - name: &cf_environment "environment"
    label: "Entorno"
    type: "select"
    required: false
    object_types:
      - "dcim.device"
      - "virtualization.virtualmachine"
    choice_set:
      name: "Environment"
      choices:
        - value: "production"
          label: "Producción"
        - value: "certification"
          label: "Certificación"
        - value: "development"
          label: "Desarrollo"

  - name: &cf_inventory_uuid "inventory_uuid"
    label: "UUID de inventario"
    type: "text"
    required: false
    object_types:
      - "dcim.device"
      - "virtualization.virtualmachine"

  - name: &cf_cpu_model "cpu_model"
    label: "Modelo CPU"
    type: "text"
    required: false
    object_types:
      - "dcim.device"
      - "virtualization.virtualmachine"

  - name: &cf_cpu_cores "cpu_cores"
    label: "Cores CPU"
    type: "integer"
    required: false
    object_types:
      - "dcim.device"

  - name: &cf_cpu_threads "cpu_threads"
    label: "Threads CPU"
    type: "integer"
    required: false
    object_types:
      - "dcim.device"

  - name: &cf_cpu_sockets "cpu_sockets"
    label: "Sockets CPU"
    type: "integer"
    required: false
    object_types:
      - "dcim.device"

  - name: &cf_disks "disks"
    label: "Discos"
    type: "text"
    required: false
    object_types:
      - "dcim.device"
      - "virtualization.virtualmachine"

  - name: &cf_raid "raid"
    label: "RAID"
    type: "text"
    required: false
    object_types:
      - "dcim.device"

  - name: &cf_bios_version "bios_version"
    label: "Versión BIOS"
    type: "text"
    required: false
    object_types:
      - "dcim.device"

  - name: &cf_bios_date "bios_date"
    label: "Fecha BIOS"
    type: "text"
    required: false
    object_types:
      - "dcim.device"

  - name: &cf_rundeck_node "rundeck_node"
    label: "Nodo Rundeck"
    type: "boolean"
    required: false
    default: false
    object_types:
      - "dcim.device"
      - "virtualization.virtualmachine"

  - name: &cf_os_version "os_version"
    label: "Version SO Host"
    type: "text"
    required: false
    object_types:
      - "dcim.device"
      - "virtualization.virtualmachine"

  - name: &cf_hypervisor_os "hypervisor_os"
    label: "SO Hipervisor"
    type: "text"
    required: false
    object_types:
      - "dcim.device"

  - name: &cf_hypervisor_version "hypervisor_version"
    label: "Version SO Hipervisor"
    type: "text"
    required: false
    object_types:
      - "dcim.device"

# ── Mapeo DML por tipo de nodo (ver docs/netbox_mapping.md) ──
node_types:
  device:
    status:
      default: "inventory"
    native_mappings:
      - source: *col_machine_name
        target: "name"
        required: true

      - source: [*col_serial, *col_service_tag]
        target: "serial"
        transform: "coalesce"
        required: false
        is_unique: true

      - source: *col_asset_tag
        target: "asset_tag"
        required: false
        is_unique: true

      - source: *col_pos_u
        target: "position"
        required: false
        cast: "int"

      - source: [*col_desc, *col_notes]
        target: "description"
        transform: "concat_dot"
        required: false

    custom_mappings:
      - source: *col_inventory_uuid
        target: *cf_inventory_uuid
        cast: lower

      - source: *col_machine_type
        target: *cf_machine_type

      - source: *col_environment
        target: *cf_environment

      - source: *col_cpu_model
        target: *cf_cpu_model

      - source: *col_cpu_cores
        target: *cf_cpu_cores
        cast: "int"

      - source: *col_cpu_threads
        target: *cf_cpu_threads
        cast: "int"

      - source: *col_cpu_sockets
        target: *cf_cpu_sockets
        cast: "int"

      - source: *col_disks
        target: *cf_disks

      - source: *col_raid
        target: *cf_raid

      - source: *col_bios_version
        target: *cf_bios_version

      - source: *col_bios_date
        target: *cf_bios_date

      - source: *col_rundeck_node
        target: *cf_rundeck_node
        cast: "bool_si_no"

      - source: *col_os_version
        target: *cf_os_version

      - source: *col_hypervisor_os
        target: *cf_hypervisor_os

      - source: *col_hypervisor_version
        target: *cf_hypervisor_version

  virtual_machine:
    status:
      default: "staged"
    native_mappings:
      - source: *col_machine_name
        target: "name"
        required: true

      - source: *col_cpu_cores
        target: "vcpus"
        required: false
        cast: "float"

      - source: *col_ram_gb
        target: "memory"
        required: false
        cast: "int_gb_to_mb"

      - source: *col_disk_cap
        target: "disk"
        required: false
        cast: "float_to_int"

      - source: [*col_desc, *col_notes]
        target: "description"
        transform: "concat_dot"
        required: false

    custom_mappings:
      - source: *col_inventory_uuid
        target: *cf_inventory_uuid
        cast: lower

      - source: *col_machine_type
        target: *cf_machine_type

      - source: *col_environment
        target: *cf_environment

      - source: *col_cpu_model
        target: *cf_cpu_model

      - source: *col_disks
        target: *cf_disks

      - source: *col_rundeck_node
        target: *cf_rundeck_node
        cast: "bool_si_no"

      - source: *col_os_version
        target: *cf_os_version

# ── Valores equivalentes a vacío/null ──────────────────────

empty_values:
  - "N/A"
  - ""
  - "None"
  - "Not Settable"
  - "Not Applicable"
  - "Not Available"
  - "Unknown"
  - "-----"
  - "------"
  - "-------"
