# netbox_mapping.yaml
# ====================
# Contrato de exportación entre merged_inventory.csv y NetBox 4.6+.
# Leído exclusivamente por export_to_netbox.py.
# No depende de rundeck_header_list.txt.
#
# Documentación completa: docs/netbox_mapping.md
# Credenciales: se leen desde variables de entorno (ver docs/usage_and_config.md).

csv_columns:
  machine_name:
    source: &col_machine_name "Nombre maquina"
    required: true
  machine_type:
    source: &col_machine_type "Tipo de maquina"
    required: true
    map:
      "Dedicada": "dedicated"
      "dedicated": "dedicated"
      "Hipervisor": "hypervisor"
      "hypervisor": "hypervisor"
      "VM": "vm"
      "vm": "vm"
    cluster_host_types:
      - "hypervisor"
    virtual_machine_types:
      - "vm"
  os:
    source: "SO Host"
  status:
    source: "Estado"
    map:
      "Activo": "active"
      "active": "active"
      "Planificado": "planned"
      "planned": "planned"
      "En preparación": "staged"
      "staged": "staged"
      "Fallido": "failed"
      "failed": "failed"
      "En inventario": "inventory"
      "inventory": "inventory"
      "En baja": "decommissioning"
      "decommissioning": "decommissioning"
      "Fuera de línea": "offline"
      "offline": "offline"
  role:
    source: "Rol"
  manufacturer:
    source: "Marca"
    required: true
  model:
    source: "Modelo"
    required: true
  rack:
    source: "Rack"
  host_device:
    source: "Dispositivo Host"
  cluster_name:
    source: "Cluster"
    required: true
  cores:
    source: &col_cpu_cores "Cores"
  inventory_uuid:
    source: &col_inventory_uuid "UUID"
    required: true
  os_ver:
    source: &col_os_version "Version SO Host"
  hypervisor_os:
    source: &col_hypervisor_os "SO Hipervisor"
  hypervisor_ver:
    source: &col_hypervisor_version "Version SO Hipervisor"
  serial:
    source: &col_serial "Serial Number"
  asset_tag:
    source: &col_asset_tag "Nro Inventario"
  pos_u:
    source: &col_pos_u "Posicion (U)"
  alt_u:
    source: "Altura (U)"
  desc:
    source: &col_desc "Descripcion"
  notes:
    source: &col_notes "Notas"
  environment:
    source: &col_environment "Entorno"
    map:
      "Producción": "production"
      "production": "production"
      "Certificación": "certification"
      "certification": "certification"
      "Desarrollo": "development"
      "development": "development"
  service_tag:
    source: &col_service_tag "Service Tag"
  cpu_model:
    source: &col_cpu_model "CPU Modelo"
  threads:
    source: &col_cpu_threads "Threads"
  sockets:
    source: &col_cpu_sockets "Sockets"
  disks:
    source: &col_disks "Discos"
  raid:
    source: &col_raid "RAID"
  bios_ver:
    source: &col_bios_version "Version BIOS"
  bios_date:
    source: &col_bios_date "Fecha BIOS"
  rundeck_node:
    source: &col_rundeck_node "Nodo Rundeck"
  ram_gb:
    source: &col_ram_gb "RAM (GB)"
  disk_cap:
    source: &col_disk_cap "Capacidad visible (GB)"
  iface_names:
    source: "Interfaces"
  iface_status:
    source: "Interfaces estado"
    map:
      "up": true
      "down": false
  iface_ip:
    source: "IP"
  iface_pfx:
    source: "Red IP"
  iface_mac:
    source: "MAC"

# ── Site único (se crea automáticamente si no existe) ────────
site:
  name: "${NETBOX_SITE_NAME}"
  slug: "${NETBOX_SITE_NAME}"

# ── ClusterType (se crea automáticamente si no existe) ───────
cluster_type:
  default:
    name: "Hipervisor"
    slug: "hipervisor"

