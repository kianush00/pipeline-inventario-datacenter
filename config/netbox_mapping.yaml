# ── Custom Fields (DDL schema, see docs/netbox_mapping.md) ───
custom_field_definitions:
  - name: &cf_environment "environment"
    label: "Environment"
    type: "select"
    object_types:
      - "dcim.device"
      - "virtualization.virtualmachine"
    choice_set:
      name: "Environment"
      choices:
        - value: "production"
          label: "Production"
        - value: "certification"
          label: "Certification"
        - value: "development"
          label: "Development"

  - name: &cf_inventory_uuid "inventory_uuid"
    label: "Inventory UUID"
    type: "text"
    filter_logic: "exact"
    object_types:
      - "dcim.device"
      - "virtualization.virtualmachine"

  - name: &cf_cpu_model "cpu_model"
    label: "CPU model"
    type: "text"
    object_types:
      - "dcim.device"
      - "virtualization.virtualmachine"

  - name: &cf_cpu_cores "cpu_cores"
    label: "CPU cores"
    type: "integer"
    object_types:
      - "dcim.device"

  - name: &cf_cpu_threads "cpu_threads"
    label: "CPU threads"
    type: "integer"
    object_types:
      - "dcim.device"

  - name: &cf_cpu_sockets "cpu_sockets"
    label: "CPU sockets"
    type: "integer"
    object_types:
      - "dcim.device"

  - name: &cf_disks "disks"
    label: "Disks"
    type: "text"
    object_types:
      - "dcim.device"
      - "virtualization.virtualmachine"

  - name: &cf_raid "raid"
    label: "RAID"
    type: "text"
    object_types:
      - "dcim.device"

  - name: &cf_bios_version "bios_version"
    label: "BIOS version"
    type: "text"
    object_types:
      - "dcim.device"

  - name: &cf_bios_date "bios_date"
    label: "BIOS date"
    type: "text"
    object_types:
      - "dcim.device"

  - name: &cf_rundeck_node "rundeck_node"
    label: "Rundeck node"
    type: "boolean"
    default: false
    object_types:
      - "dcim.device"
      - "virtualization.virtualmachine"

  - name: &cf_os_version "os_version"
    label: "Host OS version"
    type: "text"
    object_types:
      - "dcim.device"
      - "virtualization.virtualmachine"

  - name: &cf_hypervisor_os "hypervisor_os"
    label: "Hypervisor OS"
    type: "text"
    object_types:
      - "dcim.device"

  - name: &cf_hypervisor_version "hypervisor_version"
    label: "Hypervisor OS version"
    type: "text"
    object_types:
      - "dcim.device"

# ── DML mapping per node type (see docs/netbox_mapping.md) ───
node_types:
  device:
    status:
      default: "inventory"
    native_mappings:
      - source: *col_machine_name
        target: "name"
        required: true

      - source: [*col_serial, *col_service_tag]
        target: "serial"
        transform: "coalesce"
        is_unique: true

      - source: *col_asset_tag
        target: "asset_tag"
        is_unique: true

      - source: *col_pos_u
        target: "position"
        cast: "rack_position"

      - source: [*col_desc, *col_notes]
        target: "description"
        transform: "concat_dot"

    custom_mappings:
      - source: *col_inventory_uuid
        target: *cf_inventory_uuid
        cast: lower

      - source: *col_environment
        target: *cf_environment

      - source: *col_cpu_model
        target: *cf_cpu_model

      - source: *col_cpu_cores
        target: *cf_cpu_cores
        cast: "int"

      - source: *col_cpu_threads
        target: *cf_cpu_threads
        cast: "int"

      - source: *col_cpu_sockets
        target: *cf_cpu_sockets
        cast: "int"

      - source: *col_disks
        target: *cf_disks

      - source: *col_raid
        target: *cf_raid

      - source: *col_bios_version
        target: *cf_bios_version

      - source: *col_bios_date
        target: *cf_bios_date

      - source: *col_rundeck_node
        target: *cf_rundeck_node
        cast: "bool_yes_no"

      - source: *col_os_version
        target: *cf_os_version

      - source: *col_hypervisor_os
        target: *cf_hypervisor_os

      - source: *col_hypervisor_version
        target: *cf_hypervisor_version

  virtual_machine:
    status:
      default: "staged"
    native_mappings:
      - source: *col_machine_name
        target: "name"
        required: true

      - source: [*col_cpu_threads, *col_cpu_sockets]
        target: "vcpus"
        transform: "product"
        cast: "float"

      - source: *col_ram_gb
        target: "memory"
        cast: "int_gb_to_mb"

      - source: *col_disk_cap
        target: "disk"
        cast: "int_gb_to_mb"

      - source: [*col_desc, *col_notes]
        target: "description"
        transform: "concat_dot"

    custom_mappings:
      - source: *col_inventory_uuid
        target: *cf_inventory_uuid
        cast: lower

      - source: *col_environment
        target: *cf_environment

      - source: *col_cpu_model
        target: *cf_cpu_model

      - source: *col_disks
        target: *cf_disks

      - source: *col_rundeck_node
        target: *cf_rundeck_node
        cast: "bool_yes_no"

      - source: *col_os_version
        target: *cf_os_version

# ── Values equivalent to empty/null ────────────────────────

empty_values:
  - "N/A"
  - ""
  - "None"
  - "Not Settable"
  - "Not Applicable"
  - "Not Available"
  - "Unknown"
  - "-----"
  - "------"
  - "-------"
