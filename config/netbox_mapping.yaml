# netbox_mapping.yaml
# ====================
# Export contract between merged_inventory.csv and NetBox 4.6+.
# Read exclusively by export_to_netbox.py.
# It does not depend on rundeck_header_list.txt.
#
# Full documentation: docs/netbox_mapping.md
# Credentials: read from environment variables (see docs/usage_and_config.md).

csv_columns:
  machine_name:
    source: &col_machine_name "Machine name"
    required: true
  machine_type:
    source: "Machine type"
    required: true
    map:
      "dedicated": "dedicated"
      "hypervisor": "hypervisor"
      "vm": "vm"
  os:
    source: "Host OS"
  status:
    source: "Status"
    map:
      "active": "active"
      "planned": "planned"
      "staged": "staged"
      "failed": "failed"
      "inventory": "inventory"
      "decommissioning": "decommissioning"
      "offline": "offline"
  role:
    source: "Role"
  manufacturer:
    source: "Manufacturer"
    required: true
  model:
    source: "Model"
    required: true
  rack:
    source: "Rack"
  rack_location:
    source: "Row"
  host_device:
    source: "Host device"
  cluster_name:
    source: "Cluster"
    required: true
  inventory_uuid:
    source: &col_inventory_uuid "UUID"
    required: true
  os_ver:
    source: &col_os_version "Host OS version"
  hypervisor_os:
    source: &col_hypervisor_os "Hypervisor OS"
  hypervisor_ver:
    source: &col_hypervisor_version "Hypervisor OS version"
  serial:
    source: &col_serial "Serial Number"
  part_number:
    source: "P/N"
  asset_tag:
    source: &col_asset_tag "Inventory number"
  pos_u:
    source: &col_pos_u "Position (U)"
  height_u:
    source: "Height (U)"
  desc:
    source: &col_desc "Description"
  notes:
    source: &col_notes "Notes"
  environment:
    source: &col_environment "Environment"
    map:
      "production": "production"
      "certification": "certification"
      "development": "development"
  service_tag:
    source: &col_service_tag "Service Tag"
  cpu_model:
    source: &col_cpu_model "CPU model"
  cores:
    source: &col_cpu_cores "Cores (per socket)"
  threads:
    source: &col_cpu_threads "Threads (per socket)"
  sockets:
    source: &col_cpu_sockets "Sockets"
  disks:
    source: &col_disks "Disks"
  raid:
    source: &col_raid "RAID"
  bios_ver:
    source: &col_bios_version "BIOS version"
  bios_date:
    source: &col_bios_date "BIOS date"
  rundeck_node:
    source: &col_rundeck_node "Rundeck node"
  ram_gb:
    source: &col_ram_gb "RAM (GB)"
  disk_cap:
    source: &col_disk_cap "Visible capacity (GB)"
  iface_names:
    source: "Interfaces"
  iface_status:
    source: "Interfaces status"
    map:
      "up": true
      "down": false
  iface_ip:
    source: "IP"
  iface_pfx:
    source: "IP network"
  iface_mac:
    source: "MAC"

# ── Single site (created automatically if it does not exist) ─
site:
  name: "${NETBOX_SITE_NAME}"
  slug: "${NETBOX_SITE_NAME}"

# ── ClusterType (created automatically if it does not exist) ─
cluster_type:
  default:
    name: "Hypervisor"
    slug: "hypervisor"

